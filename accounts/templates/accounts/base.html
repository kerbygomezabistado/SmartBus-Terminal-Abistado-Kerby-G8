<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBus Terminal | Transit Management & Kiosk</title>
    <style>
        :root {
            --navy: #0f172a;
            --navy-light: #1e293b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .brand-badge {
            background: var(--accent);
            color: var(--navy);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0.55rem 1.1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

        .btn-kiosk {
            background-color: var(--accent);
            color: var(--navy);
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.35);
        }
        .btn-kiosk:hover { background-color: var(--accent-hover); color: #fff; transform: translateY(-1px); }

        .btn-success { background-color: var(--success); color: #ffffff; }
        .btn-success:hover { background-color: #059669; }

        .btn-danger { background-color: var(--danger); color: #ffffff; }
        .btn-danger:hover { background-color: #dc2626; }

        .btn-outline {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.2); }

        .btn-link {
            color: var(--primary);
            background: transparent;
            padding: 0.5rem;
            text-align: center;
        }
        .btn-link:hover { text-decoration: underline; }

        .w-100 { width: 100%; }

        .container {
            width: 100%;
            max-width: 960px;
            margin: 2.5rem auto;
            padding: 0 1.25rem;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -6px rgba(15, 23, 42, 0.04);
            border: 1px solid var(--border);
        }

        .auth-card {
            max-width: 460px;
            margin: 0 auto;
        }

        .card-header {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .card-header h2, .card-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--navy);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        form p {
            margin-bottom: 1.1rem;
        }

        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--navy-light);
            margin-bottom: 0.35rem;
        }

        form input[type="text"],
        form input[type="password"],
        form input[type="email"],
        form input[type="number"],
        form select,
        form textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        form input:focus,
        form select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        form input[type="file"] {
            padding: 0.5rem;
            background: #f8fafc;
            border: 1.5px dashed #cbd5e1;
            border-radius: 8px;
            width: 100%;
            font-size: 0.85rem;
        }

        .helptext {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        ul.errorlist {
            list-style: none;
            background: #fef2f2;
            color: #b91c1c;
            border-left: 4px solid var(--danger);
            padding: 0.6rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }

        .alert {
            padding: 0.9rem 1.1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.92rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--primary);
            background-color: #eff6ff;
            color: #1e40af;
        }

        .alert-success {
            background-color: #ecfdf5;
            color: #065f46;
            border-left-color: var(--success);
        }

        .alert-error, .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border-left-color: var(--danger);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-amber { background: #fef3c7; color: #92400e; }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .feature-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .feature-box h4 {
            font-size: 1rem;
            color: var(--navy);
            margin-bottom: 0.4rem;
        }

        .feature-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
        }

        .footer-note {
            text-align: center;
            padding: 1.25rem;
            color: var(--text-muted);
            font-size: 0.82rem;
            border-top: 1px solid var(--border);
            background: #ffffff;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="{% url 'home' %}">
        🚌 SmartBus Terminal
        <span class="brand-badge">40-Seat Sync</span>
    </a>
    <div class="nav-links">
        <a href="{% url 'kiosk' %}" class="btn btn-kiosk">🎟️ Passenger Kiosk</a>
        {% if user.is_authenticated %}
            <a href="{% if user.role == 'manager' %}{% url 'manager_dashboard' %}{% else %}{% url 'driver_dashboard' %}{% endif %}" class="btn btn-outline">Dashboard</a>
            <a href="{% url 'profile' %}" class="btn btn-outline">My Profile</a>
            <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline">Staff Login</a>
            <a href="{% url 'register' %}" class="btn btn-primary">Register Staff</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">
            {{ message }}
        </div>

    {% endfor %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
