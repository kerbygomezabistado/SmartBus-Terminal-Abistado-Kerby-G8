<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartBus Terminal</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-4 mb-4">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">🚌 SmartBus Terminal</a>
    <div>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}" class="btn btn-outline-light btn-sm me-2">My Profile</a>
            <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
            <a href="{% url 'register' %}" class="btn btn-light btn-sm">Register</a>
        {% endif %}
    </div>
</nav>
<div class="container">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
