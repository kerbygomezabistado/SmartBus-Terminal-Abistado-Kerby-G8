{% extends 'accounts/base.html' %}
{% block content %}
<div class="card p-4 mx-auto shadow-sm" style="max-width: 420px;">
    <h3 class="mb-3">SmartBus Login</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 text-center">No account yet? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
