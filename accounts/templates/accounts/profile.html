{% extends 'accounts/base.html' %}
{% block content %}
<div class="card p-4 mx-auto shadow-sm" style="max-width: 500px;">
    <h3 class="mb-3">My Profile ({{ user.get_role_display }})</h3>
    {% if user.profile_photo %}
        <div class="text-center mb-3">
            <img src="{{ user.profile_photo.url }}" class="rounded-circle object-fit-cover" width="100" height="100" alt="Profile Photo">
        </div>
    {% endif %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100">Update Profile</button>
    </form>
    <a href="{% if user.role == 'manager' %}{% url 'manager_dashboard' %}{% else %}{% url 'driver_dashboard' %}{% endif %}" class="btn btn-link mt-2 w-100">Back to Dashboard</a>
</div>
{% endblock %}
