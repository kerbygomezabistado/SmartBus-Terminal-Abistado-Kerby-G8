{% extends 'accounts/base.html' %}
{% block content %}
<div class="card p-4 mx-auto shadow-sm" style="max-width: 500px;">
    <h3 class="mb-3">Create SmartBus Account</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
